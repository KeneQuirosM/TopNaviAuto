<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — TOP NAVI AUTO Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/admin/assets/css/admin-base.css" />
  <link rel="stylesheet" href="/admin/assets/css/admin-components.css" />
</head>
<body>
  <div class="admin-layout is-hidden" data-js="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/dashboard.html" class="admin-sidebar__logo">TOP NAVI <span>AUTO</span></a>
      <nav class="admin-sidebar__nav">
        <a href="/admin/products.html" class="admin-sidebar__link">Productos</a>
        <a href="/admin/promotions.html" class="admin-sidebar__link">Promociones</a>
        <a href="/admin/contacts.html" class="admin-sidebar__link">Contactos</a>
        <button type="button" class="admin-sidebar__link admin-sidebar__link--logout" data-js="logout-btn">
          Cerrar sesión
        </button>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-main__header">
        <h1 class="admin-main__title">Panel TOP NAVI AUTO</h1>
        <p class="admin-main__user">Sesión: <span data-js="admin-username">Administrador</span></p>
      </header>

      <div class="admin-main__content">
        <div class="stat-cards">
          <div class="stat-card">
            <p class="stat-card__value" data-js="stat-total-products">—</p>
            <p class="stat-card__label">Total productos</p>
          </div>
          <div class="stat-card">
            <p class="stat-card__value" data-js="stat-active-products">—</p>
            <p class="stat-card__label">Productos activos</p>
          </div>
          <div class="stat-card">
            <p class="stat-card__value" data-js="stat-active-promotions">—</p>
            <p class="stat-card__label">Promociones vigentes</p>
          </div>
          <div class="stat-card">
            <p class="stat-card__value" data-js="stat-pending-contacts">—</p>
            <p class="stat-card__label">Solicitudes pendientes</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/assets/js/admin-main.js"></script>
</body>
</html>

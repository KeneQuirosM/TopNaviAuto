<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — TOP NAVI AUTO Admin</title>
  <link rel="stylesheet" href="/admin/assets/css/admin-base.css" />
  <link rel="stylesheet" href="/admin/assets/css/admin-components.css" />
</head>
<body>
  <main class="admin-login">
    <form class="admin-card admin-login__card" data-js="login-form" autocomplete="off">
      <p class="admin-login__logo">TOP NAVI <span>AUTO</span></p>
      <p class="admin-login__subtitle">Panel de administración</p>

      <div class="form-admin__group">
        <label class="form-admin__label" for="login-email">Correo electrónico</label>
        <input
          class="form-admin__input"
          type="email"
          id="login-email"
          name="email"
          data-js="login-email"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-admin__group">
        <label class="form-admin__label" for="login-password">Contraseña</label>
        <input
          class="form-admin__input"
          type="password"
          id="login-password"
          name="password"
          data-js="login-password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="admin-btn admin-btn--primary admin-btn--block" data-js="login-submit">
        Ingresar
      </button>

      <p class="alert alert--error is-hidden" data-js="login-error" role="alert"></p>
    </form>
  </main>

  <script type="module" src="/admin/assets/js/admin-main.js"></script>
</body>
</html>
